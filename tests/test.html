<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <title>Labirynt - testy</title>
  <style>
    body { font: 14px/1.5 system-ui, sans-serif; margin: 16px; background: #fff; color: #111; }
    .pass { color: #0a6b2c; }
    .fail { color: #b00020; font-weight: 600; }
  </style>
</head>
<body>
  <h1>Labirynt - testy</h1>
  <p id="summary">Uruchamianie...</p>
  <ul id="results"></ul>

  <script src="harness.js"></script>
  <script src="../js/rng.js"></script>
  <script src="rng.test.js"></script>
  <script src="../js/maze.js"></script>
  <script src="maze.test.js"></script>
  <script src="../js/game.js"></script>
  <script src="game.test.js"></script>
  <script src="../js/storage.js"></script>
  <script src="storage.test.js"></script>
  <script src="../js/input.js"></script>
  <script src="input.test.js"></script>
  <script src="../js/render.js"></script>
  <script src="render.test.js"></script>
  <script src="../js/ui.js"></script>
  <script src="ui.test.js"></script>
  <!-- koniec listy skryptów -->

  <script>
    (function () {
      const results = window.T.run();
      const failed = results.filter((r) => !r.ok).length;
      const summary = document.getElementById('summary');
      summary.textContent = (results.length - failed) + '/' + results.length + ' zaliczonych';
      summary.dataset.failed = String(failed);
      summary.className = failed ? 'fail' : 'pass';
      const list = document.getElementById('results');
      for (const r of results) {
        const li = document.createElement('li');
        li.className = r.ok ? 'pass' : 'fail';
        li.textContent = (r.ok ? 'PASS ' : 'FAIL ') + r.name + (r.ok ? '' : ': ' + r.error);
        list.appendChild(li);
      }
    })();
  </script>
</body>
</html>
